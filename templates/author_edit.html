{% extends 'home.html' %}

{% block content %}
	<h3>编辑作者</h3>
    <form action="" method="post">
        <p>作者姓名: <input type="text" name="name" value="{{ author_obj.name }}"></p>
        <p>作者年龄: <input type="text" name="age" value="{{ author_obj.age }}"></p>
        <p>邮箱地址: <input type="text" name="email" value="{{ author_obj.email }}"></p>
        <p>手机号: <input type="text" name="phone" value="{{ author_obj.author_detail.phone }}"></p>
        <p>家庭地址: <input type="text" name="addr" value="{{ author_obj.author_detail.addr }}"></p>
        <input type="submit" class="btn btn-success">
    </form>
{% endblock %}
