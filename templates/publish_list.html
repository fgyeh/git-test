{% extends 'home.html' %}

{% block content %}
    <a href="{% url 'publish_add' %}" class="btn btn-success">添加</a>
	<table class="table table-striped">
        <thead>
            <tr>
                <th>id</th>
                <th>出版社</th>
                <th>出版社地址</th>
                <th>操作</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for publish_obj in publish_queryset %}
            	<tr>
                    <td>{{ publish_obj.id }}</td>
                    <td>{{ publish_obj.name }}</td>
                    <td>{{ publish_obj.addr }}</td>
                    <td><a href="{% url 'publish_edit' publish_obj.id %}" class="btn btn-primary btn-xs">编辑</a></td>
                    <td><a href="{% url 'publish_delete' publish_obj.id %}" class="btn btn-danger btn-xs">删除</a></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
